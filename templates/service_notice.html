<link rel="stylesheet" href="{{ url_for('static', filename='css/service-notice.css', v='3.154') }}" />
<dialog id="service-notice" class="service-notice" aria-labelledby="service-notice-title" aria-describedby="service-notice-purpose">
  <div class="service-notice-layout">
    <header class="service-notice-head">
      <span class="service-notice-label">휴 스코프 · 개인용 서비스</span>
      <h2 id="service-notice-title" tabindex="-1" autofocus>이용 전 안내</h2>
    </header>
    <div class="service-notice-body">
      <p id="service-notice-purpose"><strong class="service-notice-item-title">개인용·비공개 서비스입니다.</strong>NC문화재단의 공식 서비스가 아니며, 기관의 입장을 대변하지 않습니다.</p>
      <p><strong class="service-notice-item-title">AI 요약은 참고용입니다.</strong>뉴스·영상·AI 결과에는 오류가 있을 수 있으니 원문을 확인해 주세요.</p>
      <p class="service-notice-warning"><strong class="service-notice-item-title">외부 공유·공식 인용은 삼가 주세요.</strong>기관·개인을 평가하거나 사실을 검증한 자료가 아닙니다.</p>
    </div>
    <form method="dialog" class="service-notice-actions" id="service-notice-form">
      <label class="service-notice-today"><input type="checkbox" id="service-notice-hide-today"><span>오늘 하루 보지 않기</span></label>
      <button type="submit" value="confirmed">확인</button>
    </form>
  </div>
</dialog>
<script src="{{ url_for('static', filename='js/service-notice.js', v='3.154') }}"></script>
