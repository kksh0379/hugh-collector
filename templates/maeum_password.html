<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>마음기록 · 비밀번호 확인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f6f8fc;color:#17263f;font-family:system-ui,-apple-system,sans-serif;padding:24px}main{width:100%;max-width:390px;background:white;border:1px solid #dce3ef;border-radius:24px;padding:32px;box-shadow:0 12px 40px #17263f08}h1{font-size:25px;margin:0 0 12px}p{font-size:14px;line-height:1.7;color:#64748b}label{display:block;font-size:14px;font-weight:700;margin:26px 0 8px}input[type=password]{width:100%;min-height:48px;padding:12px;border:1px solid #b9c6d9;border-radius:10px;font-size:18px}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #9cbff7;outline-offset:3px}button{width:100%;min-height:48px;margin-top:16px;background:#2d6cdf;color:white;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.error{color:#b42318;margin:12px 0 0}a{display:inline-block;margin-top:24px;color:#425675;font-size:14px;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>마음기록</h1>
    <p>비밀번호를 입력하면 마음기록 기획서를 열 수 있어요.</p>
    <form method="post" action="/maeum-record">
      <input type="hidden" name="challenge" value="{{ challenge }}">
      <label for="maeum-password">비밀번호</label>
      <input id="maeum-password" name="password" type="password" autocomplete="current-password" required autofocus{% if error %} aria-invalid="true" aria-describedby="password-error"{% endif %}>
      {% if error %}<p class="error" id="password-error" role="alert">{{ error }}</p>{% endif %}
      <button type="submit">마음기록 열기</button>
    </form>
    <a href="/">← 서비스 홈으로</a>
  </main>
</body>
</html>
